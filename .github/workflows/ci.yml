name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:web
      - run: pnpm check:artifact
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build instrumented Pages-base artifact
        run: VITE_BASE_PATH=/quantum-royale/ pnpm build:test
      - name: Test built Pages-base artifact in Chromium
        run: VITE_BASE_PATH=/quantum-royale/ QUANTUM_ROYALE_E2E_BASE_PATH=/quantum-royale/ QUANTUM_ROYALE_E2E_BUILT=1 pnpm exec playwright test
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
